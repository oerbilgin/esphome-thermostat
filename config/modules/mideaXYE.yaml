esphome:
  includes:
    - modules/xyeVars.h

substitutions:
  sensor_update_interval: 1s
  aux_update_interval: 15s

sensor:
# This sensor updates once a second and just checks the Serial() buffer for anything to read
# A response is always 32 bytes of data, but only the first 30 are useful.
# If we happen to check the buffer midstream then this will skip that cycle and finish reading it on the next cycle.
# if nothing more comes in then it dumps the data
# Last, it checks if there was data waiting to be sent and sends that data after reading.
  - platform: template
    name: "Inlet Air Temperature"
    unit_of_measurement: "°F"
    update_interval: 1s
    filters:
      - delta: 0.5
      - lambda: return (x - 40.0) / 2.0; // convert byte -> C
      - lambda: return x * 9.0 / 5.0 + 32.0; // convert C -> F 
    id: t1
    device_class: temperature
    lambda: return xyeVars.recData[T1_INDEX];
    on_value: 
      then:
        - if:
            condition: 
              lambda: 'return std::isnan(id(active_temperature_sensor).state);'
            then:
              - logger.log:
                  format: "active_temperature_sensor is unavailable, so using t1 temp in the UI"
                  level: WARN
                  tag: "mideaXYE.t1"
              - select.set:
                  id: temp_source_select
                  option: "Air Handler"
              - script.execute: 
                  id: update_current_temp_arcs
        - logger.log:
            format: "t1 emperature changed to %.1f, updating active sensor and setpoints"
            args: x
            level: INFO
            tag: "mideaXYE.t1"
        - component.update: active_temperature_sensor
        - component.update: hvac_status

# this is the temperature of the refrigerant coming into the air handler from the compressor
# when it gets hot your compressor is heating, when it gets cold you are cooling.
# otherwise it should drift close to ambient or T1
  - platform: template
    name: "Coil A Temperature"
    update_interval: 1s
    filters:
      - delta: 0.5
      - lambda: return (x - 40.0) / 2.0; // convert byte -> C
      - lambda: return x * 9.0 / 5.0 + 32.0; // convert C -> F 
    lambda: return xyeVars.recData[T2A_INDEX];
    id: t2a
    unit_of_measurement: "°F"
    device_class: temperature
    on_value:
      - component.update: hvac_status

  - platform: template
    name: "Coil B Temperature"
    update_interval: 1s
    filters:
      - delta: 0.5
      - lambda: return (x - 40.0) / 2.0; // convert byte -> C
      - lambda: return x * 9.0 / 5.0 + 32.0; // convert C -> F 
    lambda: return xyeVars.recData[T2B_INDEX];
    id: t2b
    unit_of_measurement: "°F"
    device_class: temperature
  
  - platform: template
    name: "E1 Status Code"
    update_interval: 1s
    filters:
      - delta: 0.5
    lambda: 'return xyeVars.recData[REC_E1];'
    id: e1
  
  - platform: template
    name: "E2 Status Code"
    update_interval: 1s
    filters:
      - delta: 0.5
    lambda: 'return xyeVars.recData[REC_E1];'
    id: e2

# I don't think this is truly outside temperature. I think it's exhaust air temperature
# from the compressor outside which is ambient when it's not running.
  - platform: template
    name: "Compressor Outlet Temperature"
    update_interval: 1s
    filters:
      - delta: 0.5
      - lambda: return (x - 40.0) / 2.0; // convert byte -> C
      - lambda: return x * 9.0 / 5.0 + 32.0; // convert C -> F 
    lambda: return xyeVars.recData[T3_INDEX];
    id: t3
    unit_of_measurement: "°F"
    device_class: temperature
    on_value:
      - component.update: hvac_status

# internal helper sensor to track the real and intended state of the fan bytes
  - platform: template
    name: Fan Bytes Sensor
    update_interval: never # push-updated from the updater script
    filters:
      - delta: 0.5
    # use fanBytes instead of recData because fanBytes is set after we dump the stale data after sending
    lambda: |-
      // only update the value if we aren't waiting to send any commands
      // this prevents the on_value from triggering during a send-command from a select component
      if (!xyeVars.commandSent && !xyeVars.newInput) {
        return xyeVars.fanBytes;
      } else return -1; // this represents a "pending confirmation" state
    id: fanBytes
    entity_category: "diagnostic"
    on_value:
      # update the dependent text sensors/selects
      # only if we aren't waiting to send some new data
      - lambda: |-
          ESP_LOGD("sensor.fanBytes.on_value", "fanBytes value changed to %f, and xyeVars.commandSent is: %s, and xyeVars.newInput is %s", x, xyeVars.commandSent ? "true" : "false", xyeVars.newInput ? "true" : "false");
          if (!xyeVars.newInput && !xyeVars.commandSent) {
            if (x == -1) {
              ESP_LOGE("sensor.fanBytes.on_value", "We are not waiting for a command to be done, but fanBytes sensor is '-1' still!");
            }
            // update the UI components anyway to get the error state
            ESP_LOGD("sensor.fanBytes.on_value", "updating fanStatus text sensor");
            id(fanStatus).update();
            ESP_LOGD("sensor.fanBytes.on_value", "updating fanMode select");
            id(fanMode).update();
          } else {
            ESP_LOGD("sensor.fanBytes.on_value", "We are in the middle of a change, not updating fanStatus and fanMode.");
          }

# internal helper sensor to track the state of the opmode bytes
  - platform: template
    name: OpMode Bytes Sensor
    update_interval: never # push-updated from the updater uart script
    filters:
      - delta: 0.5
    # use opBytes instead of recData because it is set after we dump the stale data after sending
    lambda: |-
      // only update the value if we aren't waiting to send any commands
      // this prevents the on_value from triggering during a send-command from a select component
      if (!xyeVars.commandSent && !xyeVars.newInput) {
        return xyeVars.opBytes;
      } else return -1; // this represents a "pending confirmation" state
    id: opBytes
    entity_category: "diagnostic"
    on_value:
      # update the dependent text sensors/selects
      # only if we aren't waiting to send some new data
      - lambda: |-
          ESP_LOGD("sensor.opBytes.on_value", "opBytes value changed to %f, and xyeVars.commandSent is: %s, and xyeVars.newInput is %s", x, xyeVars.commandSent ? "true" : "false", xyeVars.newInput ? "true" : "false");
          if (!xyeVars.newInput && !xyeVars.commandSent) {
            if (x == -1) {
              ESP_LOGE("sensor.opBytes.on_value", "We are not waiting for a command to be done, but opBytes sensor is '-1' still!");
            }
            // update the UI components anyway to get the error state
            ESP_LOGD("sensor.opBytes.on_value", "updating opMode select");
            id(opMode).update();
          } else {
            ESP_LOGD("sensor.opBytes.on_value", "We are in the middle of a change, not updating opMode.");
          }

# sensor to see what the actual internal set temp is
  - platform: template
    id: internal_setpoint_sensor
    name: Internal Setpoint
    update_interval: 1s
    device_class: temperature
    unit_of_measurement: "°C"
    filters:
      - delta: 0.5
    # use setTemp instead of recData because it is set after we dump the stale data after sending
    lambda: |-
      // only update the value if we aren't waiting to send any commands
      // this prevents the on_value from triggering during a send-command from a select component
      if (!xyeVars.commandSent && !xyeVars.newInput) {
        return xyeVars.setTemp;
      } else return {}; // unchanged if we're in the middle of a send command
    on_value:
      - lambda: |-
          // if we arent waiting for a command to send, and this value is different than the number component
          // this is a potential problem.
          if (!xyeVars.commandSent && !xyeVars.newInput && x != id(internal_set_point).state) {
            ESP_LOGI("sensor.internal_setpoint_sensor",
              "Internal setpoint is %f, but the internal setpoint number is %f! Resyncing the number without set_action...",
              x, id(internal_set_point).state
            );
            id(internal_set_point).publish_state(x);
          }


select:
  - platform: template
    name: "Fan Mode"
    id: fanMode
    update_interval: never # interval above updates this if fanBytes ever changes
    options:
      - 'low'
      - 'medium'
      - 'high'
      - 'auto'
    lambda: |-
      ESP_LOGD("select.fanMode", "Entering fanMode lambda...");
      std::vector<uint8_t> auto_modes = {0x80, 0x81, 0x82, 0x84};

      // cast fanBytes back to uint8
      // use fanBytes sensor as this holds intended values on change, and eventually gets updated by recdata if incorrect
      uint8_t fanBytesVal = static_cast<uint8_t>(id(fanBytes).state);

      if (fanBytesVal == 0x01) {
        ESP_LOGD("mideaXYE.fanMode","fanBytes is 0x%02X, xyeVars.fanMode set to high",fanBytesVal);
        xyeVars.fanMode = "high";
      } else if (fanBytesVal == 0x02) {
        ESP_LOGD("mideaXYE.fanMode","fanBytes is 0x%02X, xyeVars.fanMode set to medium",fanBytesVal);
        xyeVars.fanMode = "medium";
      } else if (fanBytesVal == 0x04) {
        ESP_LOGD("mideaXYE.fanMode","fanBytes is 0x%02X, xyeVars.fanMode set to low",fanBytesVal);
        xyeVars.fanMode = "low";
      } else if (std::find(auto_modes.begin(), auto_modes.end(), fanBytesVal) != auto_modes.end()) {
        ESP_LOGD("mideaXYE.fanMode","fanBytes is 0x%02X, xyeVars.fanMode set to auto",fanBytesVal);
        xyeVars.fanMode = "auto";
      } else if (fanBytesVal == 0x00) {
        ESP_LOGD("mideaXYE.fanMode","fanBytes is 0x%02X, not changing xyeVars.fanMode. it is still %s",fanBytesVal, id(fanMode).current_option().c_str());
      } else {
        ESP_LOGE("mideaXYE.fanMode","xyeVars.fanMode defaulting to auto, invalid mode input: %02X",fanBytesVal);
        xyeVars.fanMode = "auto";
      }
      return xyeVars.fanMode;
    set_action: 
      - lambda: |-
          ESP_LOGD("select.fanMode", "Entering fanMode set_action, fanmode changed to %s", x.c_str());
          if (xyeVars.fanMode != x)
          {
            xyeVars.fanMode = x;
            ESP_LOGI("mideaXYE.fanMode","change fan to: %s",x.str().c_str());
            if (xyeVars.fanMode == "high"){
              xyeVars.fanBytesSend = 0x01;
            } else if (xyeVars.fanMode == "auto"){
              xyeVars.fanBytesSend = 0x80;
            } else if (xyeVars.fanMode == "medium"){
              xyeVars.fanBytesSend = 0x02;
            } else if (xyeVars.fanMode == "low"){
              xyeVars.fanBytesSend = 0x04;
            } else {
              xyeVars.fanBytesSend = 0x80;
              ESP_LOGE("mideaXYE.fanMode","Defaulting to auto, invalid fan input: %s",x.str().c_str());
            }
            ESP_LOGI(
              "mideaXYE.fanMode","selected 0x%x, pressing button to send",
              xyeVars.fanBytesSend.value_or(0xDEADBEEF)
            );
            xyeVars.newInput = true;
            
            // Be optimistic here, since any real value will be published back on the roundtrip
            // since fanBytes the sensor will be different from recdata
            id(fanMode).publish_state(x);
            id(fanBytes).update(); // sets this to the temporary value
          }
    on_value:
      then:
        - logger.log:
            format: "Entering fanMode on_value, fanMode changed to %s"
            args: x.c_str()
            level: DEBUG
            tag: select.fanMmode
        - script.execute:
            id: update_fan_mode_ui
            fan_mode: !lambda 'return x;'


  - platform: template
    id: opMode
    name: "Operating Mode"
    update_interval: never # the opBytes sensor updates this on change
    options:
      - 'off'
      - 'auto'
      - 'cool'
      - 'dry'
      - 'heat'
      - 'fan_only'
      # need to add switch case for updating the value based off xyeVars.opBytes
    lambda: |-
      ESP_LOGD("mideaXYE.opMode", "Entering opMode lambda. xyeVars.opBytes is 0x%02x", xyeVars.opBytes);
      switch (xyeVars.opBytes)
      {
        case 0x00:
          xyeVars.op = "off";
          break;
        case 0x91:
          xyeVars.op = "auto";
          break;
        case 0x88:
          xyeVars.op = "cool";
          break;
        case 0x82:
          xyeVars.op = "dry";
          break;
        case 0x84:
          xyeVars.op = "heat";
          break;
        case 0x81:
          xyeVars.op = "fan_only";
          break;
        default:
          ESP_LOGE("mideaXYE.opMode","xyeVars.op defaulting to off, invalid mode input: %02X",xyeVars.opBytes);
          xyeVars.op = "off";
      }
      ESP_LOGD("mideaXYE.opMode", "xyeVars.op is %s", xyeVars.op.c_str());
      return xyeVars.op;
    set_action:
      - lambda: |-
          if (xyeVars.op != x)
          {
            xyeVars.op = x;
            if (xyeVars.op == "off"){
              xyeVars.opBytesSend = 0x00;
            } else if (xyeVars.op == "auto"){
              xyeVars.opBytesSend = 0x91;
            } else if (xyeVars.op == "cool"){
              xyeVars.opBytesSend = 0x88;
            } else if (xyeVars.op == "dry"){
              xyeVars.opBytesSend = 0x82;
            } else if (xyeVars.op == "heat"){
              xyeVars.opBytesSend = 0x84;
            } else if (xyeVars.op == "fan_only"){
              xyeVars.opBytesSend = 0x81;
            } else {
              xyeVars.opBytesSend = 0x00;
              ESP_LOGE("mideaXYE.opMode","Defaulting to off, invalid mode input: %s",x.str().c_str());
            }
            ESP_LOGI(
              "mideaXYE.opMode","selected %x for mode, setting send flag",
              xyeVars.opBytesSend.value_or(0xDEADBEEF)
            );
            xyeVars.newInput = true;

            // be optimistic here since the true value will eventually publish
            id(opMode).publish_state(x);
            id(opBytes).update(); // sets this to the temporary value
          }
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("mideaXYE.opMode", "Clearing hysteresis_heating_active and hysteresis_cooling_active");
            // reset the hysteresis globals
            id(hysteresis_heating_active) = false;
            id(hysteresis_cooling_active) = false; 
        - script.execute:
            id: update_hvac_mode_ui
            mode: !lambda 'return x;'
        - component.update: hvac_status
  
  # logic to determine what the hvac status is: cooling/heating/diffusing
  # this acts as a sensor (no actions on set_action), but is a select so we can get dropdowns in HASS
  - platform: template
    name: HVAC Status
    entity_category: "diagnostic"
    update_interval: never # gets updated by any changes to t1, t2a, t3, fanStatus
    id: hvac_status
    options:
      - "Idle"
      - "Heating"
      - "Cooling"
      - "Diffusing"
      - "Error"
    lambda: |-
      // this script looks at the fan modes and coil temps to determine if the unit 
      // is actively heating, cooling, or diffusing
      // if the t2a temp is > t1 by at least 10 degrees, then we are heating
      // if t2a temp is < t1 by at least 10 degrees, then we are cooling
      // if t2a temp is close to t1 temp, and fan status is not zero then we are diffusing
      // get the variables
      uint8_t t1_temp = xyeVars.recData[T1_INDEX];
      uint8_t t2a_temp = xyeVars.recData[T2A_INDEX];
      std::string fan_status = id(fanStatus).current_option();
      std::string hvac_mode = id(opMode).current_option();
      bool fan_is_on = fan_status != "Off";

      std::vector<std::string> cooling_modes = {"cool", "dry", "auto"};
      std::vector<std::string> heating_modes = {"heat", "auto"};

      int temp_threashold = 10;
      std::string result;

      if ((t2a_temp - t1_temp) > temp_threashold) {
        result = "Heating";
      } else if ((t2a_temp - t1_temp) < -temp_threashold) {
        result = "Cooling";
      } else if (fan_is_on) {
        result = "Diffusing";
      } else result = "Idle";

      // check that the status and mode match up
      if (result == "Heating" && (std::find(heating_modes.begin(), heating_modes.end(), hvac_mode) == heating_modes.end())) {
        ESP_LOGE("mideaXYE.hvac_status", "t1_temp is %u, t2_temp is %u, which means the hvac status should be %s, but the hvac mode is %s which does not make sense! Setting hvac_status to Diffusing.", t1_temp, t2a_temp, result.c_str(), hvac_mode.c_str());
        result = "Diffusing";
      } else if (result == "Cooling" && (std::find(cooling_modes.begin(), cooling_modes.end(), hvac_mode) == cooling_modes.end())) {
        ESP_LOGE("mideaXYE.hvac_status", "t1_temp is %u, t2_temp is %u, which means the hvac status should be %s, but the hvac mode is %s which does not make sense! Setting hvac_status to Diffusing.", t1_temp, t2a_temp, result.c_str(), hvac_mode.c_str());
        result = "Diffusing";
      } else if (result == "Diffusing" && hvac_mode == "off") {
        ESP_LOGW("mideaXYE.hvac_status", "t1_temp is %u, t2_temp is %u, fan_status is %s, which means the hvac status should be %s, but the hvac mode is %s which does not make sense! Setting hvac_status to Idle.", t1_temp, t2a_temp, fan_status.c_str(), result.c_str(), hvac_mode.c_str());
        result = "Idle";
      }
      
      // final check if the fan is actually on
      if ((result == "Heating" || result == "Cooling" || result == "Diffusing") && !fan_is_on) {
        ESP_LOGW("mideaXYE.hvac_status", "t1_temp is %u, t2_temp is %u, which means the hvac status should be %s, but the fan is %s which we interpret as OFF! Probably the unit just turned off.", t1_temp, t2a_temp, result.c_str(), fan_status.c_str());
        result = "Idle";
      }

      ESP_LOGD("mideaXYE.hvac_status", "t1_temp is %u, t2_temp is %u, fan_status is %s, hvac_mode is %s, and so the hvac status is %s", t1_temp, t2a_temp, fan_status.c_str(), hvac_mode.c_str(), result.c_str());
      return result;
    set_action:
      - logger.log:
          format: "hvac_status select set, but nothing will happen"
          tag: "select.hvac_status"
          level: "WARN"
    on_value:
      - script.execute: update_hvac_status_ui

# this sensor tells us what the current fan speed is
# its actually a select so that we can treat it as an enum in HASS
  - platform: template
    name: Fan Status
    entity_category: "diagnostic"
    update_interval: never # gets updated by changes to fanBytes sensor
    id: fanStatus
    options:
      - "Off"
      - "Low"
      - "Medium"
      - "High"
      - "Error"
    lambda: |-
      // update the fan status
      // define the options
      std::vector<uint8_t> off_status = {0x00, 0x80};
      std::vector<uint8_t> low_status = {0x04, 0x84};
      std::vector<uint8_t> med_status = {0x02, 0x82};
      std::vector<uint8_t> high_status = {0x01, 0x81};

      // cast fanBytes back to uint8
      // use fanBytes sensor as this holds intended values on change, and eventually gets updated by recdata if incorrect
      uint8_t fanBytesVal = static_cast<uint8_t>(id(fanBytes).state);

      // assert fanbytes == xyeVars.fanBytes
      if (fanBytesVal != xyeVars.fanBytes) {
        ESP_LOGE("mideaXYE.fanStatus", "fanBytesVal (0x%02x) != xyeVars.fanBytes (0x%02x)!", fanBytesVal, xyeVars.fanBytes);
        return "Error";
      } else {
        // set the fanStatus
        // std::find returns numbers.end() if the value isn't found
        if (std::find(off_status.begin(), off_status.end(), fanBytesVal) != off_status.end()) {
            ESP_LOGD("mideaXYE.fanStatus", "fanBytes is 0x%02x and means OFF", fanBytesVal);
            return "Off";
        } else if (std::find(low_status.begin(), low_status.end(), fanBytesVal) != low_status.end()) {
            ESP_LOGD("mideaXYE.fanStatus", "fanBytes is 0x%02x and means LOW", fanBytesVal);
             return "Low";
        } else if (std::find(med_status.begin(), med_status.end(), fanBytesVal) != med_status.end()) {
            ESP_LOGD("mideaXYE.fanStatus", "fanBytes is 0x%02x and means MED", fanBytesVal);
            return "Medium";
        } else if (std::find(high_status.begin(), high_status.end(), fanBytesVal) != high_status.end()) {
            ESP_LOGD("mideaXYE.fanStatus", "fanBytes is 0x%02x and means HIGH", fanBytesVal);
            return "High";
        } else {
          ESP_LOGE("mideaXYE.fanStatus", "fanBytes is 0x%02x, and could not determine what this means!", fanBytesVal);
          return "Error";
        }
      }
    on_value:
      - component.update: hvac_status
    set_action:
      - logger.log:
          format: "fanStatus select set, but nothing will happen"
          tag: "select.fanStatus"
          level: "WARN"
    

# this is the internal setpoint for the hvac controller
# we will adjust this one as needed to get the behavior that we want
# we will hide this one from the UI; it's an internal one only
number:
  - platform: template
    name: "Internal Set Point"
    id: internal_set_point
    update_interval: never
    internal: true # dont want anyone changing this directly, it's just for internal use
    step: 1
    mode: box
    min_value: 0
    max_value: 100
    unit_of_measurement: "°C"
    device_class: temperature
    set_action:
      - then:
        - lambda: |-
            // only send a new value if it's different from the old value. Prevents unnecessary sends.
            if (x != id(internal_set_point).state) {
              ESP_LOGD("mideaXYE.internal_set_point", "internal_set_point changed to %f, sending command to change setTemp", x);
              xyeVars.setTempSend = std::round(x);
              xyeVars.newInput = true;
              id(internal_set_point).publish_state(x); // be optimistic here since the true value will eventually publish
            }



