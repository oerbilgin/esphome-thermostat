esphome:
  includes:
    - modules/xyeVars.h

substitutions:
  sensor_update_interval: 1s
  aux_update_interval: 15s

script:
# This script temporarily sets the internal setpoint value
# need to do it in a separate script because the delay step is not blocking this way vs. in cpp
  - id: jiggle_internal_setpoint
    mode: single
    parameters:
      current_internal_setpoint: float
      temporary_setpoint: float
    then:
      - number.set:
          id: internal_set_point
          value: !lambda 'return temporary_setpoint;'
      - delay: 30s
      - script.execute: 
          id: update_setpoints
          visible_setpoint: !lambda 'return id(visible_setpoint_value).state;'

interval:
# This interval checks the setpoints and current temps and hvac status
# and jiggles the internal setpoint if needed to lower the midea's deadband
  - id: setpoint_watcher
    interval: 60s
    then:
      - lambda: |-
          // immediately stop if the device isn't initialized yet
          if (!id(device_initialized)) return;

          std::string hvac_mode = id(opMode).current_option();
          std::string hvac_state = id(hvac_status).state;
          
          // exit fast if this check is unnecessary
          if ((hvac_mode == "cool" || hvac_mode == "heat" || hvac_mode == "auto") && (hvac_state == "Idle")) {
            ESP_LOGD(
              "mideaXYE.setpoint_watcher",
              "hvac_mode is %s and hvac_state is %s, checking the setpoint against the deadband...",
              hvac_mode.c_str(), hvac_state.c_str()
            );
          } else {
            ESP_LOGD(
              "mideaXYE.setpoint_watcher",
              "hvac_mode is %s and hvac_state is %s, no need to check the setpoint against the deadband, exiting.",
              hvac_mode.c_str(), hvac_state.c_str()
            );
            return;
          }

          float visible_setpoint = id(visible_setpoint_value).state;
          float current_temp = id(average_house_temperature).state;
          float deadband_value = id(deadband).state;
          uint8_t current_internal_setpoint = id(internal_set_point).state;
          float temporary_setpoint = 0.0;

          ESP_LOGD(
            "mideaXYE.setpoint_watcher",
            "current temp: %f, visible_setpoint: %f, deadband_value: %f",
            current_temp, visible_setpoint, deadband_value
            );

          float temp_delta = current_temp - visible_setpoint;

          if (temp_delta < -deadband_value && hvac_mode == "heat") {
            // it is colder than we want yet the hvac isn't heating; increase internal setpoint to trigger heating
            temporary_setpoint = current_internal_setpoint + deadband_value;
            ESP_LOGD(
              "mideaXYE.setpoint_watcher",
              "hvac state of %s and temp_delta of %f, need to trigger heating, so temporarily set the internal setpoint to %f",
              hvac_state.c_str(), temp_delta, temporary_setpoint
            );
          } else if (temp_delta > deadband_value && hvac_mode == "cool") {
            // it is hotter than we want yet the hvac isn't cooling; decrease internal setpoint to trigger heating
            temporary_setpoint = current_internal_setpoint - deadband_value;
            ESP_LOGD(
              "mideaXYE.setpoint_watcher",
              "hvac state of %s and temp_delta of %f, need to trigger cooling, so temporarily set the internal setpoint to %f",
              hvac_state.c_str(), temp_delta, temporary_setpoint
            );
          } else if (hvac_mode == "auto") {
              // TODO: implement this
              ESP_LOGW(
                "mideaXYE.setpoint_watcher",
                "Auto mode jiggle not implemented!"
                );
          } else {
            ESP_LOGD(
              "mideaXYE.setpoint_watcher",
              "hvac_mode '%s' and temp_delta '%f' are incompatible for a jiggle.",
              hvac_mode.c_str(), temp_delta
            );
            return;
          }

          ESP_LOGD(
            "mideaXYE.setpoint_watcher",
            "temporary_setpoint is %f",
            temporary_setpoint
            );
          if (temporary_setpoint != 0) {
            // fire off the script to do the jiggle
            ESP_LOGD(
              "mideaXYE.setpoint_watcher",
              "internal_setpoint is %u and t1 temp is %f",
              current_internal_setpoint, id(t1).state
            );
            ESP_LOGI(
              "mideaXYE.setpoint_watcher",
              "Jiggling internal setpoint from %u to %f for 30 seconds.",
              current_internal_setpoint, temporary_setpoint
            );
            id(jiggle_internal_setpoint).execute(current_internal_setpoint, temporary_setpoint);
          } else ESP_LOGD(
              "mideaXYE.setpoint_watcher",
              "temporary_setpoint is zero, no need to jiggle."
            );
  # update sensors
  - id: update_sensors
    interval: $sensor_update_interval
    then:
      - lambda: |-
          if (!id(device_initialized)) return;

          // publish sensor states only if recdata is different (i.e. only on new values)
          // publishing state skips the set_action, but not on_value
          if (id(t1).state != xyeVars.recData[T1_INDEX]) {
            ESP_LOGI("mideaXYE.update_sensors", "t1 state has changed from %f to %u", id(t1).state, xyeVars.recData[T1_INDEX]);
            id(t1).publish_state(xyeVars.recData[T1_INDEX]);
          }

          if (id(t2a).state != xyeVars.recData[T2A_INDEX]) {
            ESP_LOGI("mideaXYE.update_sensors", "t2a state has changed from %f to %u", id(t2a).state, xyeVars.recData[T2A_INDEX]);
            id(t2a).publish_state(xyeVars.recData[T2A_INDEX]);
          }

          if (id(t2b).state != xyeVars.recData[T2B_INDEX]) {
            ESP_LOGI("mideaXYE.update_sensors", "t2b state has changed from %f to %u", id(t2b).state, xyeVars.recData[T2B_INDEX]);
            id(t2b).publish_state(xyeVars.recData[T2B_INDEX]);
          }

          if (id(t3).state != xyeVars.recData[T3_INDEX]) {
            ESP_LOGI("mideaXYE.update_sensors", "t3 state has changed from %f to %u", id(t3).state, xyeVars.recData[T3_INDEX]);
            id(t3).publish_state(xyeVars.recData[T3_INDEX]);
          }

          if (id(fanBytes).state != xyeVars.recData[REC_FAN]) {
            ESP_LOGI("mideaXYE.update_sensors", "fanBytes state has changed from %f to %u", id(fanBytes).state, xyeVars.recData[REC_FAN]);
            id(fanBytes).publish_state(xyeVars.recData[REC_FAN]);

            // update the fanmode and fanstatus text sensors/selects
            id(fanStatus).update();
            id(fanMode).update();
          }

          if (id(modeBytes).state != xyeVars.recData[REC_MODE]) {
            ESP_LOGI("mideaXYE.update_sensors", "modeBytes state has changed from %f to %u", id(modeBytes).state, xyeVars.recData[REC_MODE]);
            id(modeBytes).publish_state(xyeVars.recData[REC_MODE]);

            // update the mode select
            id(opMode).update();
          }

          if (id(internal_set_point).state != xyeVars.recData[REC_TEMP]) {
            ESP_LOGI("mideaXYE.update_sensors", "setTemp has changed from %f to %u", id(internal_set_point).state, xyeVars.recData[REC_TEMP]);
            id(internal_set_point).publish_state(xyeVars.recData[REC_TEMP]);
            id(internal_setpoint_sensor).publish_state(xyeVars.recData[REC_TEMP]);
          }

          if (id(e1).state != xyeVars.recData[REC_E1]) {
            ESP_LOGI("mideaXYE.update_sensors", "e1 has changed from %f to %u", id(e1).state, xyeVars.recData[REC_E1]);
            id(e1).publish_state(xyeVars.recData[REC_E1]);
          }

          if (id(e2).state != xyeVars.recData[REC_E2]) {
            ESP_LOGI("mideaXYE.update_sensors", "e2 has changed from %f to %u", id(e2).state, xyeVars.recData[REC_E2]);
            id(e2).publish_state(xyeVars.recData[REC_E2]);
          }



sensor:
# This sensor updates once a second and just checks the Serial() buffer for anything to read
# A response is always 32 bytes of data, but only the first 30 are useful.
# If we happen to check the buffer midstream then this will skip that cycle and finish reading it on the next cycle.
# if nothing more comes in then it dumps the data
# Last, it checks if there was data waiting to be sent and sends that data after reading.
  - platform: template
    name: "Inlet Air Temperature"
    unit_of_measurement: "°F"
    update_interval: never # state gets published via the interval above
    id: t1
    device_class: temperature
    on_value: 
      then:
        - logger.log:
            format: "t1 emperature changed to %.1f, executing update_setpoints script"
            args: x
            level: DEBUG
            tag: "mideaXYE.t1"
        - script.execute:
            id: update_setpoints
            visible_setpoint: !lambda 'return id(visible_setpoint_value).state;'
        - component.update: hvac_status


# this is the temperature of the refrigerant coming into the air handler from the compressor
# when it gets hot your compressor is heating, when it gets cold you are cooling.
# otherwise it should drift close to ambient or T1
  - platform: template
    name: "Coil A Temperature"
    update_interval: never # state gets published via the interval above
    id: t2a
    unit_of_measurement: "°F"
    device_class: temperature
    on_value:
      - component.update: hvac_status

  - platform: template
    name: "Coil B Temperature"
    update_interval: never # state gets published via the interval above
    id: t2b
    unit_of_measurement: "°F"
    device_class: temperature
  
  - platform: template
    name: "E1 Status Code"
    update_interval: never # state gets published via the interval above
    id: e1
  
  - platform: template
    name: "E2 Status Code"
    update_interval: never # state gets published via the interval above
    id: e2

# I don't think this is truly outside temperature. I think it's exhaust air temperature
# from the compressor outside which is ambient when it's not running.
  - platform: template
    name: "Outside Air Temperature"
    update_interval: never # state gets published via the interval above
    id: t3
    unit_of_measurement: "°F"
    device_class: temperature
    on_value:
      - component.update: hvac_status

# internal helper sensor to track the state of the fan bytes
  - platform: template
    name: Fan Bytes Sensor
    update_interval: never # state gets published via the interval above
    id: fanBytes
    internal: True

# internal helper sensor to track the state of the opmode bytes
  - platform: template
    name: OpMode Bytes Sensor
    update_interval: never # state gets published via the interval above
    id: modeBytes
    internal: True

# sensor to see the internal set temp
# mirrors internal_setpoint number without allowing users to change it directly
  - platform: template
    name: Internal Setpoint
    update_interval: never # state gets published via the interval above
    id: internal_setpoint_sensor


text_sensor:
# logic to determine what the hvac status is: cooling/heating/diffusing
  - platform: template
    name: HVAC Status
    update_interval: never # gets updated by any changes to t1, t2a, t3, fanStatus
    id: hvac_status
    lambda: |-
      // this script looks at the fan modes and coil temps to determine if the unit 
      // is actively heating, cooling, or diffusing
      // if the t2a temp is > t1 by at least 10 degrees, then we are heating
      // if t2a temp is < t1 by at least 10 degrees, then we are cooling
      // if t2a temp is close to t1 temp, and fan status is not zero then we are diffusing
      // get the variables
      uint8_t t1_temp = xyeVars.recData[T1_INDEX];
      uint8_t t2a_temp = xyeVars.recData[T2A_INDEX];
      std::string fan_status = id(fanStatus).state;
      std::string hvac_mode = id(opMode).current_option();
      bool fan_is_on = fan_status != "off";

      std::vector<std::string> cooling_modes = {"cool", "dry", "auto"};
      std::vector<std::string> heating_modes = {"heat", "auto"};

      int temp_threashold = 10;
      std::string result;

      if ((t2a_temp - t1_temp) > temp_threashold) {
        result = "Heating";
      } else if ((t2a_temp - t1_temp) < -temp_threashold) {
        result = "Cooling";
      } else if (fan_is_on) {
        result = "Diffusing";
      } else result = "Idle";

      // check that the status and mode match up
      if (result == "Heating" && (std::find(heating_modes.begin(), heating_modes.end(), hvac_mode) == heating_modes.end())) {
        ESP_LOGE("mideaXYE.hvac_status", "t1_temp is %u, t2_temp is %u, which means the hvac status should be %s, but the hvac mode is %s which does not make sense! Setting hvac_status to Diffusing.", t1_temp, t2a_temp, result.c_str(), hvac_mode.c_str());
        result = "Diffusing";
      } else if (result == "Cooling" && (std::find(cooling_modes.begin(), cooling_modes.end(), hvac_mode) == cooling_modes.end())) {
        ESP_LOGE("mideaXYE.hvac_status", "t1_temp is %u, t2_temp is %u, which means the hvac status should be %s, but the hvac mode is %s which does not make sense! Setting hvac_status to Diffusing.", t1_temp, t2a_temp, result.c_str(), hvac_mode.c_str());
        result = "Diffusing";
      } else if (result == "Diffusing" && hvac_mode == "off") {
        // FIXME: mode and fan sometimes are out of sync, by milliseconds resulting in this code path.
        // FIXME: if modebytes gets updated it doesnt seem like this lambda is being triggered? what does opMode lambda do?
        ESP_LOGE("mideaXYE.hvac_status", "t1_temp is %u, t2_temp is %u, fan_status is %s, which means the hvac status should be %s, but the hvac mode is %s which does not make sense! Setting hvac_status to err.", t1_temp, t2a_temp, fan_status.c_str(), result.c_str(), hvac_mode.c_str());
        result = "err";
      }
      
      // final check if the fan is actually on
      if ((result == "Heating" || result == "Cooling" || result == "Diffusing") && !fan_is_on) {
        ESP_LOGE("mideaXYE.hvac_status", "t1_temp is %u, t2_temp is %u, which means the hvac status should be %s, but the fan is %s which we interpret as OFF! Setting hvac_status to err.", t1_temp, t2a_temp, result.c_str(), fan_status.c_str());
        result = "err";
      }

      ESP_LOGD("mideaXYE.hvac_status", "t1_temp is %u, t2_temp is %u, fan_status is %s, hvac_mode is %s, and so the hvac status is %s", t1_temp, t2a_temp, fan_status.c_str(), hvac_mode.c_str(), result.c_str());
      return result;
    on_value:
      - script.execute: update_hvac_status_ui

# this sensor tells us what the current fan speed is
  - platform: template
    name: Fan Status
    update_interval: never # gets updated by changes to fanBytes in the interval above
    id: fanStatus
    lambda: |-
      // update the fan status
      // define the options
      std::vector<uint8_t> off_status = {0x00, 0x80};
      std::vector<uint8_t> low_status = {0x04, 0x84};
      std::vector<uint8_t> med_status = {0x02, 0x82};
      std::vector<uint8_t> high_status = {0x01, 0x81};

      // cast fanBytes back to uint8
      uint8_t fanBytes = xyeVars.recData[REC_FAN];

      // assert fanbytes == xyeVars.fanBytes
      if (fanBytes != xyeVars.fanBytes) {
        ESP_LOGE("mideaXYE.fanStatus", "xyeVars.recData[REC_FAN] (0x%02x) != xyeVars.fanBytes (0x%02x)!", fanBytes, xyeVars.fanBytes);
        return "err";
      } else {
        // set the fanStatus
        // std::find returns numbers.end() if the value isn't found
        if (std::find(off_status.begin(), off_status.end(), fanBytes) != off_status.end()) {
            ESP_LOGD("mideaXYE.fanStatus", "fanBytes is 0x%02x and means OFF", fanBytes);
            return "off";
        } else if (std::find(low_status.begin(), low_status.end(), fanBytes) != low_status.end()) {
            ESP_LOGD("mideaXYE.fanStatus", "fanBytes is 0x%02x and means LOW", fanBytes);
             return "low";
        } else if (std::find(med_status.begin(), med_status.end(), fanBytes) != med_status.end()) {
            ESP_LOGD("mideaXYE.fanStatus", "fanBytes is 0x%02x and means MED", fanBytes);
            return "med";
        } else if (std::find(high_status.begin(), high_status.end(), fanBytes) != high_status.end()) {
            ESP_LOGD("mideaXYE.fanStatus", "fanBytes is 0x%02x and means HIGH", fanBytes);
            return "high";
        } else {
          ESP_LOGE("mideaXYE.fanStatus", "fanBytes is 0x%02x, and could not determine what this means!", fanBytes);
          return "err";
        }
      }
    on_value:
      - component.update: hvac_status
      

select:
  - platform: template
    name: "Fan Mode"
    id: fanMode
    update_interval: never # interval above updates this if fanBytes ever changes
    options:
      - 'low'
      - 'medium'
      - 'high'
      - 'auto'
      
    lambda: |-
      std::vector<uint8_t> auto_modes = {0x80, 0x81, 0x82, 0x84};

      if (xyeVars.fanBytes == 0x01) {
        ESP_LOGD("mideaXYE.fanMode","xyeVars.fanBytes is 0x%02X, xyeVars.fanMode set to high",xyeVars.fanBytes);
        xyeVars.fanMode = "high";
      } else if (xyeVars.fanBytes == 0x02) {
        ESP_LOGD("mideaXYE.fanMode","xyeVars.fanBytes is 0x%02X, xyeVars.fanMode set to medium",xyeVars.fanBytes);
        xyeVars.fanMode = "medium";
      } else if (xyeVars.fanBytes == 0x04) {
        ESP_LOGD("mideaXYE.fanMode","xyeVars.fanBytes is 0x%02X, xyeVars.fanMode set to low",xyeVars.fanBytes);
        xyeVars.fanMode = "low";
      } else if (std::find(auto_modes.begin(), auto_modes.end(), xyeVars.fanBytes) != auto_modes.end()) {
        ESP_LOGD("mideaXYE.fanMode","xyeVars.fanBytes is 0x%02X, xyeVars.fanMode set to auto",xyeVars.fanBytes);
        xyeVars.fanMode = "auto";
      } else if (xyeVars.fanBytes == 0x00) {
        ESP_LOGD("mideaXYE.fanMode","xyeVars.fanBytes is 0x%02X, not changing xyeVars.fanMode. it is still %s",xyeVars.fanBytes, id(fanMode).current_option().c_str());
      } else {
        ESP_LOGE("mideaXYE.fanMode","xyeVars.fanMode defaulting to auto, invalid mode input: %02X",xyeVars.fanBytes);
        xyeVars.fanMode = "auto";
      }
      return xyeVars.fanMode;
    set_action: 
      - lambda: |-
          if (xyeVars.fanMode != x)
          {
            xyeVars.fanMode = x;
            ESP_LOGI("mideaXYE.fanMode","change fan to: %s",x.str().c_str());
            if (xyeVars.fanMode == "high"){
              xyeVars.fanBytesSend = 0x01;
            } else if (xyeVars.fanMode == "auto"){
              xyeVars.fanBytesSend = 0x80;
            } else if (xyeVars.fanMode == "medium"){
              xyeVars.fanBytesSend = 0x02;
            } else if (xyeVars.fanMode == "low"){
              xyeVars.fanBytesSend = 0x04;
            } else {
              xyeVars.fanBytesSend = 0x80;
              ESP_LOGE("mideaXYE.fanMode","Defaulting to auto, invalid fan input: %s",x.str().c_str());
            }
            ESP_LOGI("mideaXYE.fanMode","selected 0x%x, pressing button to send",
            xyeVars.fanBytesSend ? static_cast<unsigned int>(*xyeVars.fanBytesSend) : 0xDEADBEEF);
            xyeVars.newInput = true;
            // id(fanMode).publish_state(x); // Dont think we need to publish state since the true value will round trip in recdata?
          }
    on_value:
      then:
        - script.execute:
            id: update_fan_mode_ui
            fan_mode: !lambda 'return x;'


  - platform: template
    id: opMode
    name: "Operating Mode"
    update_interval: never # interval above updates this if the opBytes ever change
    options:
      - 'off'
      - 'auto'
      - 'cool'
      - 'dry'
      - 'heat'
      - 'fan_only'
      # need to add switch case for updating the value based off xyeVars.opBytes
    lambda: |-
      ESP_LOGD("mideaXYE.opMode", "Entering opMode lambda. xyeVars.opBytes is 0x%02x", xyeVars.opBytes);
      switch (xyeVars.opBytes)
      {
        case 0x00:
          xyeVars.op = "off";
          break;
        case 0x91:
          xyeVars.op = "auto";
          break;
        case 0x88:
          xyeVars.op = "cool";
          break;
        case 0x82:
          xyeVars.op = "dry";
          break;
        case 0x84:
          xyeVars.op = "heat";
          break;
        case 0x81:
          xyeVars.op = "fan_only";
          break;
        default:
          ESP_LOGE("mideaXYE.opMode","xyeVars.op defaulting to off, invalid mode input: %02X",xyeVars.opBytes);
          xyeVars.op = "off";
      }
      ESP_LOGD("mideaXYE.opMode", "xyeVars.op is %s", xyeVars.op.c_str());
      return xyeVars.op;
    set_action:
      - lambda: |-
          if (xyeVars.op != x)
          {
            xyeVars.op = x;
            if (xyeVars.op == "off"){
              xyeVars.opBytesSend = 0x00;
            } else if (xyeVars.op == "auto"){
              xyeVars.opBytesSend = 0x91;
            } else if (xyeVars.op == "cool"){
              xyeVars.opBytesSend = 0x88;
            } else if (xyeVars.op == "dry"){
              xyeVars.opBytesSend = 0x82;
            } else if (xyeVars.op == "heat"){
              xyeVars.opBytesSend = 0x84;
            } else if (xyeVars.op == "fan_only"){
              xyeVars.opBytesSend = 0x81;
            } else {
              xyeVars.opBytesSend = 0x00;
              ESP_LOGE("mideaXYE.opMode","Defaulting to off, invalid mode input: %s",x.str().c_str());
            }
            ESP_LOGI("mideaXYE.opMode","selected %x for mode, setting send flag",
            xyeVars.opBytesSend ? static_cast<unsigned int>(*xyeVars.opBytesSend) : 0xDEADBEEF);
            xyeVars.newInput = true;
            // id(opMode).publish_state(x); // dont think we need to do this since it will eventually roundtrip with recdata?
          }
    on_value:
      then:
        - script.execute:
            id: update_hvac_mode_ui
            mode: !lambda 'return x;'

# this is the internal setpoint for the hvac controller
# we will adjust this one as needed to get the behavior that we want
# we will hide this one from the UI; it's an internal one only
number:
  - platform: template
    name: "Internal Set Point"
    id: internal_set_point
    update_interval: never # is updated on change by the update_sensors interval
    internal: true # dont want anyone changing this directly, it's just for internal use
    step: 1
    mode: box
    min_value: 0
    max_value: 100
    unit_of_measurement: "°F"
    device_class: temperature
    set_action:
      - then:
        - lambda: |-
            ESP_LOGD("mideaXYE.internal_set_point", "internal_set_point changed to %f, sending command to change setTemp", x);
            xyeVars.setTempSend = x;
            xyeVars.newInput = true;
            // id(internal_set_point).publish_state(x); // dont think we need to do this since it will update on roundtrip?
  
  # this number defines a custom deadband we can use to override the midea unit's internal deadband
  # by seeing if the temp delta between setpoint and actual is greater than the deadband, we can jiggle the setpoint to force the unit to kick on.
  - platform: template
    name: Deadband
    id: deadband
    entity_category: "config"
    step: 1
    mode: box
    min_value: 0
    max_value: 5
    unit_of_measurement: "°F"
    device_class: temperature
    initial_value: 5 # pretty much guaranteed not to fire; full midea control
    restore_value: True
    optimistic: True

