# this module contains only the UART configuration for the mideaXYE module. It is included in the main mideaXYE.yaml file.
# This allows us to run the SDL2 simulation without having the UART stuff
# these scripts and sensors are used to send and receive data from the air handler. 
# The send_command script is called when a new input is received from the UI, and it constructs the command to send to the air handler. 
# The wait_send script is called when we have data that was blocked by incoming data, and it sends that data after the incoming data has been processed. 
# The updater sensor checks for incoming data and processes it by writing to xyeVars.
# The querier sensor sends a query package to the air handler every 15 seconds.

# add this to replace the mySerial thing from arduino 
uart:
  id: midea_uart
  tx_pin: GPIO44 # This is the correct pin for the waveshare device
  rx_pin: GPIO43 # This is the correct pin for the waveshare device
  baud_rate: 4800
  data_bits: 8
  stop_bits: 1
  parity: NONE

script:
# this script sends data that was blocked by incoming data
  - id: wait_send
    then:
    - lambda: |-
        id(midea_uart).write_array(xyeVars.waitSendData,16);
        xyeVars.waitingForResponse = true;
        xyeVars.waitingToSend = false;
        xyeVars.commandSent = true;

# this will construct the command to send to the air handler, called by the input sensors
# when required.  It tries to not send if we're in the middle of receiving.
  - id: send_command
    then:
    - lambda: |-
        if (!xyeVars.waitingForResponse)
        {
          uint8_t resp;
          ESP_LOGD(
            "mideaXYE_UART.send_command",
            "send_command starting: opBytes=0x%02X fanBytes=0x%02X setTemp=0x%02X newInput=%s commandSent=%s waitingForResponse=%s",
            xyeVars.opBytes,
            xyeVars.fanBytes,
            xyeVars.setTemp,
            xyeVars.newInput ? "true" : "false",
            xyeVars.commandSent ? "true" : "false",
            xyeVars.waitingForResponse ? "true" : "false"
          );
          // check to see if the op, fan, or settemp send vars are not empty; if yes then send it, if no then just send the current val
          if (xyeVars.opBytesSend) { 
            ESP_LOGI("mideaXYE_UART.send_command", "New op value to send: 0x%02X", static_cast<unsigned int>(*xyeVars.opBytesSend));
            xyeVars.sendData[SEND_MODE] = *xyeVars.opBytesSend; xyeVars.opBytesSend.reset(); 
            } else { xyeVars.sendData[SEND_MODE] = xyeVars.opBytes; }
          
          if (xyeVars.fanBytesSend) { 
            ESP_LOGI("mideaXYE_UART.send_command", "New fan value to send: 0x%02X", static_cast<unsigned int>(*xyeVars.fanBytesSend));
            xyeVars.sendData[SEND_FAN] = *xyeVars.fanBytesSend; xyeVars.fanBytesSend.reset(); 
            } else { xyeVars.sendData[SEND_FAN] = xyeVars.fanBytes; }
          
          if (xyeVars.setTempSend) { 
            ESP_LOGI("mideaXYE_UART.send_command", "New setTemp value to send: 0x%02X", static_cast<unsigned int>(*xyeVars.setTempSend));
            xyeVars.sendData[SEND_TEMP] = *xyeVars.setTempSend; xyeVars.setTempSend.reset(); 
          } else { xyeVars.sendData[SEND_TEMP] = xyeVars.setTemp; }

          ESP_LOGD(
            "mideaXYE_UART.send_command",
            "Sending op: 0x%02X, fan: 0x%02X, setTemp: 0x%02X",
            static_cast<unsigned int>(*xyeVars.opBytesSend),
            static_cast<unsigned int>(*xyeVars.fanBytesSend),
            static_cast<unsigned int>(*xyeVars.setTempSend)
            );

          uint8_t i=0;
          uint32_t crc=0;
          int len=16;
          for(i=0;i<len;i++)
          { 
            if(i!=SEND_CRC)
            {
              crc+=xyeVars.sendData[i];
            }
          }
          ESP_LOGD("mideaXYE_UART.send_command","sum of values for CRC calc is %i",crc);
          xyeVars.sendData[SEND_CRC] = 0xFF - (crc&0xFF);
          ESP_LOGD("mideaXYE_UART.send_command","calculated CRC is %x",crc);
          std::ostringstream send_oss;
          send_oss << std::uppercase << std::hex << std::setfill('0');
          for (uint8_t j = 0; j < SEND_LEN; ++j) {
            if (j) send_oss << ' ';
            send_oss << "0x" << std::setw(2) << static_cast<int>(xyeVars.sendData[j]);
          }
          ESP_LOGD("mideaXYE_UART.send_command","final sendData: %s", send_oss.str().c_str());
          resp = id(midea_uart).available();
          if (resp==0) 
          {
            id(midea_uart).write_array(xyeVars.sendData, SEND_LEN);
            ESP_LOGD("mideaXYE_UART.send_command","sent command");
            xyeVars.waitingForResponse = true;
            xyeVars.commandSent = true;
          } else {
            ESP_LOGD("mideaXYE_UART.send_command","had to wait to send, response available=%u", resp);
            std::memcpy(xyeVars.waitSendData, xyeVars.sendData, 16);
            xyeVars.waitingToSend = true;
          }
          xyeVars.newInput = false;
          xyeVars.sendTimeCount = 0;
        }

sensor:
  - platform: template
    name: "updater"
    id: updater
    internal: true
    update_interval: $sensor_update_interval
    lambda: |-
      if (!id(device_initialized)) return 0;

      uint8_t i,resp;
      xyeVars.doneReading = false;
      ESP_LOGV("mideaXYE_UART.updater","checking for incoming serial data");
      resp = id(midea_uart).available();
      ESP_LOGV(
        "mideaXYE_UART.updater",
        "updater state: resp=%u newInput=%s commandSent=%s waitingForResponse=%s waitingToSend=%s prevResp=%u waitCount=%u",
        resp,
        xyeVars.newInput ? "true" : "false",
        xyeVars.commandSent ? "true" : "false",
        xyeVars.waitingForResponse ? "true" : "false",
        xyeVars.waitingToSend ? "true" : "false",
        xyeVars.prevResp,
        xyeVars.waitCount
      );
      if (resp>0)
      {
        ESP_LOGD("mideaXYE_UART.updater","there are %i bytes of data waiting",resp);
        if (resp == 32)
        {
          ESP_LOGD("mideaXYE_UART.updater","32 bytes of data found, reading data...");
          for (i=0; i<resp; i++)
          {
            if (i<30)
            {
              id(midea_uart).read_byte(&xyeVars.recData[i]);
            } else
            {
              uint8_t dummy;
              id(midea_uart).read_byte(&dummy);
            }
          }
          std::ostringstream packet_oss;
          packet_oss << std::uppercase << std::hex << std::setfill('0');
          for (uint8_t j = 0; j < 30; ++j) {
            if (j) packet_oss << ' ';
            packet_oss << "0x" << std::setw(2) << static_cast<int>(xyeVars.recData[j]);
          }
          ESP_LOGD("mideaXYE_UART.updater","raw packet bytes: %s", packet_oss.str().c_str());
          ESP_LOGD("mideaXYE_UART.updater","done reading, examining data");
          xyeVars.doneReading = true;
          xyeVars.waitingForResponse = false;
          xyeVars.prevResp = 0;
        } else if (xyeVars.prevResp == resp) 
        {
          // it's been 2 update cycles with no change in length of data, this is leftover data. dump it.
          for (i=0;i<resp;i++)
          {
            uint8_t dummy;
            id(midea_uart).read_byte(&dummy);
          }
          ESP_LOGD("mideaXYE_UART.updater","dumped some leftover data: %i",resp);
          xyeVars.waitingForResponse = false;
          xyeVars.prevResp = 0;
          xyeVars.doneReading = true;
        } else 
        {
              // might have caught in middle of stream
              ESP_LOGD("mideaXYE_UART.updater","got small response, wait for more. size was %i", resp);
              xyeVars.prevResp = resp;
        }
      }
      if (xyeVars.waitingForResponse)
      {
        if (xyeVars.waitCount > 2){
          uint8_t debug_bytes[32] = {0};
          for (uint8_t j = 0; j < resp; ++j) {
            id(midea_uart).read_byte(&debug_bytes[j]);
          }
          std::ostringstream oss;
          oss << std::uppercase << std::hex << std::setfill('0');
          for (uint8_t j = 0; j < resp; ++j) {
            if (j) oss << ' ';
            oss << "0x" << std::setw(2) << static_cast<int>(debug_bytes[j]);
          }
          ESP_LOGW("mideaXYE_UART.updater", "waited 3 cycles for a response, giving up. bytes: %s", oss.str().c_str());
          xyeVars.waitingForResponse = false;
          xyeVars.waitCount = 0;
          xyeVars.doneReading = true;
        } else {
          xyeVars.waitCount ++;
        }
       
      }

      if (xyeVars.doneReading) 
      {
        ESP_LOGD(
          "mideaXYE_UART.updater",
          "doneReading branch: commandSent=%s newInput=%s waitingToSend=%s",
          xyeVars.commandSent ? "true" : "false",
          xyeVars.newInput ? "true" : "false",
          xyeVars.waitingToSend ? "true" : "false"
        );
        if (!xyeVars.commandSent && !xyeVars.newInput)
        {
          bool theyMatch = true;
          for (i=0;i<6;++i)
          {
            if (i != 1) {
              if (xyeVars.recData[i]!=xyeVars.checkData[i])
              {
                theyMatch = false;
              }
            }
          }
          if (theyMatch)
          {
            // set these helper vars once all the checks have been made that this is actually the current state
            // namely this is dumping the first packet received after sending new data, as this is a stale state
            xyeVars.fanBytes = xyeVars.recData[REC_FAN];
            xyeVars.opBytes = xyeVars.recData[REC_MODE];
            xyeVars.setTemp = xyeVars.recData[REC_TEMP];
            ESP_LOGD("mideaXYE_UART.updater","Got these updated values: op 0x%02X fan 0x%02X temp %02X",xyeVars.opBytes,xyeVars.fanBytes,xyeVars.setTemp);
            
            std::ostringstream oss;
            oss << std::uppercase << std::hex << std::setfill('0');
            uint8_t i;
            for (i=0;i<(sizeof(xyeVars.recData) / sizeof(xyeVars.recData[0]));i++)
            {
              if (i>0)
              {
                oss << ' ';
              }
              oss << "0x";
              oss << std::setw(2) << static_cast<int>(xyeVars.recData[i]);
            }
            ESP_LOGD("mideaXYE_UART.updater", "full recdata: %s", oss.str().c_str());
          } else 
          {
            ESP_LOGW("mideaXYE_UART.updater","First 6 bytes of incoming data were bad, not using values");
          }
        } else
        {
          xyeVars.commandSent = false;
          ESP_LOGI("mideaXYE_UART.updater","dumping first received data after command sent OR had new input waiting to send");
        }
        if (xyeVars.waitingToSend) 
        {
          ESP_LOGI("mideaXYE_UART.updater","finished reading, had data waiting to write. now writing...");
          id(wait_send).execute();
        }
        
      }

      // now check if we need to send new data
      if (xyeVars.newInput)
      {
        // do not wait to send any commands
        id(send_command).execute();
        // TODO: delete the below code if this new pattern doesnt cause any issues
        // // give at least 5 cycles to accumulate changes (multiple presses of the temperature button for example)
        // if (xyeVars.sendTimeCount > 4) {
        //   xyeVars.sendTimeCount = 0;
        //   id(send_command).execute();
        // } else 
        // {
        //   xyeVars.sendTimeCount += 1;
        // }
      }
      return 0;


# this sensor updates every 15 seconds. when it updates, it sends a query package to the
# air handler. The query package is the always the same, xyeVars.queryData.
  - platform: template
    name: "querier"
    id: querier
    internal: true
    update_interval: $aux_update_interval
    lambda: |-
      if (!id(device_initialized)) return 0;

      ESP_LOGD("mideaXYE_UART.querier","query check. newInput: %s  waitingForResponse:  %s",xyeVars.newInput ? "true" : "false", xyeVars.waitingForResponse ? "true" : "false");
      if (!xyeVars.newInput && !xyeVars.waitingForResponse)
      {
        uint8_t resp=id(midea_uart).available();
        ESP_LOGD("mideaXYE_UART.querier","going to send a query package...");
        if (!(xyeVars.waitingToSend || (resp != 0)))
        {
          id(midea_uart).write_array(xyeVars.queryData,16);
          ESP_LOGD("mideaXYE_UART.querier","sent query package, waiting for response...");
          xyeVars.waitingForResponse = true;
        } else 
        {
          ESP_LOGD("mideaXYE_UART.querier","waiting to send/receive prevented sending query package");
        }
      }
      return 0;