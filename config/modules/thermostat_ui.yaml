            hidden: true
            scrollbar_mode: "OFF"
            widgets:
              - dropdown:
                  id: fan_options
                  x: 0
                  y: 0
                  width: 150
                  height: 48
                  options:
                    - "Auto"
                    - "Quiet"
                    - "Low"
                    - "Medium"
                    - "High"
                  selected_index: 0
                  dir: TOP
                  bg_color: !lambda 'return my_colors::button_bg_color;'
                  border_width: 1
                  border_color: !lambda 'return my_colors::text_dark_gray;'
                  radius: 12
                  text_color: !lambda 'return my_colors::main_text_color;'
                  text_font: montserrat_18
                  pad_left: 40
                  on_value:
                    - if:
                        condition:
                          lambda: 'return x == 0;'
                        then:
                          - select.set:
                              id: fanMode
                              option: "auto"
                    - if:
                        condition:
                          lambda: 'return x == 1;'
                        then:
                          - select.set:
                              id: fanMode
                              option: "low"
                    - if:
                        condition:
                          lambda: 'return x == 2;'
                        then:
                          - select.set:
                              id: fanMode
                              option: "low"
                    - if:
                        condition:
                          lambda: 'return x == 3;'
                        then:
                          - select.set:
                              id: fanMode
                              option: "medium"
                    - if:
                        condition:
                          lambda: 'return x == 4;'
                        then:
                          - select.set:
                              id: fanMode
                              option: "high"
