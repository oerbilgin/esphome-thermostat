esphome:
  includes:
    - modules/lvgl_helpers.h
    - "<lvgl.h>"
  on_boot:
    # TODO: probably can use this on_boot to fix whatever weirdness was happening with the climate element
    priority: -100 # Low priority ensures components and Wi-Fi are initialized first
    then:
      - logger.log:
          format: "Thermostat UI booted, waiting for valid temperature readings before updating setpoints"
          level: INFO
          tag: "thermostat_ui.on_boot"
      - globals.set:
          id: device_initialized
          value: 'true'
      # Wait until the temperature sensors have actual valid readings
      - wait_until:
          lambda: |-
            return !std::isnan(id(t1).state) && !std::isnan(id(average_house_temperature).state);
      - logger.log:
          format: "Valid temperature readings received, updating setpoints"
          level: INFO
          tag: "thermostat_ui.on_boot"
      - script.execute:
          id: update_setpoints
          visible_setpoint: !lambda 'return id(visible_setpoint_value).state;'

json:

substitutions:
  thermostat_box_x_pos: 382
  thermostat_box_y_pos: 10
  thermostat_box_width: 418
  thermostat_box_height: 400
  thermostat_arc_width: 400
  thermostat_arc_height: 400
  thermostat_arc_x_pos: 8
  thermostat_arc_y_pos: 10
  thermostat_indicator_arc_width: 48
  thermostat_setpoint_knob_size: 8
  thermostat_actual_knob_size: -4
  thermostat_arc_min_value: 55
  thermostat_arc_max_value: 90
  initial_setpoint_value: "72"

globals:
  - id: device_initialized
    type: bool
    initial_value: 'false'
  - id: setpoint_updating
    type: bool
    initial_value: 'false'
  - id: thermostat_arc_max_value_global
    type: int
    initial_value: '90' # cant substitute this for some reason, make sure it matches
  - id: thermostat_arc_min_value_global
    type: int
    initial_value: '55' # cant substitute this for some reason, make sure it matches
  - id: heating_setpoint_global
    type: float
    restore_value: yes
    initial_value: $initial_setpoint_value
  - id: cooling_setpoint_global
    type: float
    restore_value: yes
    initial_value: $initial_setpoint_value


select:
  # select to make comparing the fan mode options easier
  - platform: lvgl 
    id: fan_options_select
    widget: fan_options
    internal: true

script:
- id: update_setpoints
  mode: restart
  # make this the parameter so it can be used by set_action of the visible_setpoint_value number,
  # which shows the new value as 'x'; we can see the old value with id(visible_setpoint_value).state
  parameters:
    visible_setpoint: float
  then:
    - lambda: |-
        // turn on the flag to prevent UI glitches
        id(setpoint_updating) = true;

        // update the visual components
        lv_arc_set_value(id(setpoint_arc), visible_setpoint);
        lv_label_set_text(id(setpoint_number), (to_string((int)visible_setpoint) + "°F").c_str());

        // NOTE: This is one directional; if someone changes the internal setpoint on the machine, things will get wonky
        // Custom logic to get the controller to get to the desired temperature.
        // calculate the error between the actual temp and the t1 temp
        float error = id(t1).state - id(average_house_temperature).state;
        ESP_LOGD("thermostat_ui.update_setpoints","t1: %f, actual: %f, error: %f",id(t1).state,id(average_house_temperature).state,error);

        // add the error to the visible setpoint to get the internal setpoint
        // Ex1: if t1 sees 70 and its actually 75, the error is -5
        // Ex1: if my setpoint is 75, the handler should be off
        // Ex1: internal setpoint = 75 + -5 = 70, so the handler will not turn on

        // Ex2: if t1 sees 80 and its actually 75, the error is +5
        // Ex2: if my setpoint is 80, the handler should be on
        // Ex2: internal setpoint = 80 + 5 = 85, so the handler will turn on to heat

        // Ex3: if t1 sees 70 and its actually 75, the error is -5
        // Ex3: my setpoint is 70, the handler should be on
        // Ex3: internal setpoint = 70 + -5 = 65, so the handler will turn on to cool 5 degrees
        float internal_setpoint = visible_setpoint + error;
        ESP_LOGD("thermostat_ui.update_setpoints","visible setpoint: %f, new internal setpoint: %f",visible_setpoint,internal_setpoint);

        // convert to uint8_t for sending to the midea unit
        uint8_t internal_setpoint_int = static_cast<uint8_t>(std::round(internal_setpoint)); 
        ESP_LOGD("thermostat_ui.update_setpoints","internal setpoint int: %d",internal_setpoint_int);

        // set the number representing the internal setpoint of the midea unit
        // this method triggers the set_action
        auto call = id(internal_set_point).make_call();
        call.set_value(internal_setpoint_int);
        call.perform();

        // turn off the flag
        id(setpoint_updating) = false;

        // cache the global based on the mode
        std::string hvac_mode = id(opMode).current_option();
        if (hvac_mode == "heat") {
          ESP_LOGD("thermostat_ui.update_setpoints", "caching heating_setpoint_global as %f", visible_setpoint);
          id(heating_setpoint_global) = visible_setpoint;
        } else if (hvac_mode == "cool") {
          ESP_LOGD("thermostat_ui.update_setpoints", "caching cooling_setpoint_global as %f", visible_setpoint);
          id(cooling_setpoint_global) = visible_setpoint;
        } else {
          ESP_LOGD("thermostat_ui.update_setpoints", "hvac_mode is %s, so no need to cache anything.", hvac_mode.c_str());
        }

- id: update_temp_icon
  mode: restart
  parameters:
    target_label: lv_obj_t*
    temp: float
    default_icon: string
  then:
    - lambda: |-
        if (temp <= 34) {
          lv_label_set_text(target_label, "\U000F0F29"); // snowflake alert
        } else if (temp >= 95) {
          lv_label_set_text(target_label, "\U000F0E01"); // thermometer alert
        } else {
          lv_label_set_text(target_label, default_icon.c_str()); // default
        }

- id: update_wind_color
  mode: restart # Restarts the script if called again quickly
  then:
    - lambda: |-
        float s = std::isnan(id(wind_speed_today).state) ? 0.0f : id(wind_speed_today).state;
        float g = std::isnan(id(wind_gust_today).state) ? 0.0f : id(wind_gust_today).state;
        float max_wind = std::max(s, g);

        lv_color_t text_color = get_wind_text_color(max_wind);
        lv_color_t bg_color = get_wind_bg_color(max_wind);
        lv_color_t label_color;

        if (max_wind > 54) {
          label_color = my_colors::text_light_gray;
        } else {
          label_color = my_colors::text_dark_gray;
        }

        lv_obj_set_style_bg_color(id(wind_condition_chip), bg_color, LV_PART_MAIN);
        lv_obj_set_style_shadow_color(id(wind_condition_chip), bg_color, LV_PART_MAIN);
        lv_obj_set_style_text_color(id(wind_speed_label), text_color, LV_PART_MAIN);
        lv_obj_set_style_text_color(id(wind_speed_unit), text_color, LV_PART_MAIN);
        lv_obj_set_style_text_color(id(wind_gust_label), text_color, LV_PART_MAIN);
        
        lv_obj_set_style_text_color(id(wind_condtion_chip_label), label_color, LV_PART_MAIN);

        // Force immediate redraw 
        lv_obj_invalidate(id(wind_condition_chip));
- id: update_condition_icon
  mode: restart
  then:
    - lambda: |-
        const char * icon;
        lv_color_t color;
        std::string x = id(conditions_today).state;

        if (x.find("wind") != std::string::npos) {
          icon = "\U000F059D";
          color = my_colors::text_light_blue;
        } else if (x == "skc") { // clear skies
          if (id(forecast_is_daytime).state) {
            icon = "\U000F0599"; // sunny
            color = my_colors::text_yellow;
          } else {
            icon = "\U000F0594"; // clear night
            color = my_colors::text_dark_blue;
          }
        } else if (x == "few") { // few clouds
          if (id(forecast_is_daytime).state) {
            icon = "\U000F0599"; // sunny
            color = my_colors::text_yellow;
          } else {
            icon = "\U000F0594"; // clear night
            color = my_colors::text_dark_blue;
          }
        } else if (x == "sct") { // scattered clouds / partly cloudy
          if (id(forecast_is_daytime).state) {
            icon = "\U000F0595"; // partly cloudy
            color = my_colors::text_yellow;
          } else {
            icon = "\U000F0F31"; // cloudy night
            color = my_colors::text_dark_blue;
          }
        } else if (x == "bkn") { // broken clouds / mostly cloudy
            icon = "\U000F0590"; // cloudy
            color = my_colors::text_dark_gray;
        } else if (x == "ovc") { // overcast
            icon = "\U000F0590"; // cloudy
            color = my_colors::text_dark_gray;
        } else if (x == "rain") { // rain / drizzle
            icon = "\U000F0597"; // rainy
            color = my_colors::text_dark_blue;
        } else if (x == "rain_showers") { // rain
            icon = "\U000F0596"; // rain showers
            color = my_colors::text_dark_blue;
        } else if (x == "tsra") { // thunderstorms
            icon = "\U000F0593"; // lightning cloud
            color = my_colors::text_dark_blue;
        } else if (x == "snow") { // snowing
            icon = "\U000F0598"; // snowy cloud
            color = my_colors::text_light_blue;
        } else if (x == "fzra") { // freezing rain
            icon = "\U000F0598"; // snowy cloud
            color = my_colors::text_light_blue;
        } else if (x == "sleet") { // sleet
            icon = "\U000F0592"; // hail
            color = my_colors::text_light_blue;
        } else if (x == "rain_sleet") { // rain and sleet
            icon = "\U000F0592"; // hail
            color = my_colors::text_light_blue;
        } else if (x == "snow_sleet") { // snow and sleet
            icon = "\U000F0592"; // shail
            color = my_colors::text_light_blue;
        } else if (x == "fog") { // fog
            icon = "\U000F0591"; // foggy
            color = my_colors::text_dark_gray;
        } else if (x == "haze") { // haze
            icon = "\U000F0F30";  // hazy
            color = my_colors::text_dark_gray;
        } else if (x == "smoke") { // smoky
            icon = "\U000F1799"; // smoky
            color = my_colors::text_dark_gray;
        } else if (x == "blizzard") { // blizzard
            icon = "\U000F0598"; // snowy cloud
            color = my_colors::text_light_blue;
        } else { 
          icon = "\U000F02D7"; // question mark
          color = my_colors::text_dark_gray;
        };

        lv_obj_set_style_text_color(id(days_condition_icon), color, LV_PART_MAIN);
        lv_label_set_text(id(days_condition_icon), icon);
        lv_obj_invalidate(id(days_condition_icon));

- id: update_hvac_mode_ui
  mode: restart
  parameters:
    mode: string
  then:
    - if:
        condition:
          lambda: 'return mode == "off";'
        then:
          - lvgl.widget.update:
              id: off_mode_button
              state:
                checked: true
          - lvgl.widget.update:
              id:
                - cool_mode_button
                - heat_mode_button
                - fan_mode_button
                - auto_mode_button
              state:
                checked: false
          - lvgl.label.update:
              id: hvac_mode_label
              text: ""
          - lvgl.widget.show:
              - off_mode_label
              - off_mode_thermostat
          - lvgl.widget.hide:
              - setpoint
              - cool_mode_thermostat
              - heat_mode_thermostat
              - fan_mode_thermostat
              - auto_mode_thermostat
              - fan_selector
              - next_hvac_mode
              - hvac_mode_label
          - lvgl.widget.update:
              id: turbo_mode_switch
              opa: 20%
    - if:
        condition:
          lambda: 'return mode == "cool";'
        then:
          - number.set:
              id: visible_setpoint_value
              value: !lambda "return id(cooling_setpoint_global);"
          - lvgl.widget.update:
              id: cool_mode_button
              state:
                checked: true
          - lvgl.widget.update:
              id:
                - heat_mode_button
                - fan_mode_button
                - auto_mode_button
                - off_mode_button
              state:
                checked: false
          - lvgl.label.update:
              id: hvac_mode_label
              text: "Cool Setpoint"
          - lvgl.widget.hide:
              - heat_mode_thermostat
              - fan_mode_thermostat
              - auto_mode_thermostat
              - off_mode_thermostat
              - off_mode_label
          - lvgl.widget.show:
              - cool_mode_thermostat
              - setpoint
              - fan_selector
              - hvac_mode_label
          - lvgl.widget.update:
              id: turbo_mode_switch
              opa: 100% # TODO: figure out how to do turbo mode

    - if:
        condition:
          lambda: 'return mode == "heat";'
        then:
          - number.set:
              id: visible_setpoint_value
              value: !lambda "return id(heating_setpoint_global);"
          - lvgl.widget.update:
              id: heat_mode_button
              state:
                checked: true
          - lvgl.widget.update:
              id:
                - cool_mode_button
                - fan_mode_button
                - auto_mode_button
                - off_mode_button
              state:
                checked: false
          - lvgl.label.update:
              id: hvac_mode_label
              text: "Heat Setpoint"
          - lvgl.widget.hide:
              - cool_mode_thermostat
              - fan_mode_thermostat
              - auto_mode_thermostat
              - off_mode_thermostat
              - off_mode_label
          - lvgl.widget.show:
              - heat_mode_thermostat
              - setpoint
              - fan_selector
              - hvac_mode_label
          - lvgl.widget.update:
              id: turbo_mode_switch
              opa: 20%
    - if:
        condition:
          lambda: 'return mode == "fan_only";'
        then:
          - lvgl.widget.update:
              id: fan_mode_button
              state:
                checked: true
          - lvgl.widget.update:
              id:
                - cool_mode_button
                - heat_mode_button
                - auto_mode_button
                - off_mode_button
              state:
                checked: false
          - lvgl.widget.hide:
              - cool_mode_thermostat
              - heat_mode_thermostat
              - auto_mode_thermostat
              - off_mode_thermostat
              - off_mode_label
              - hvac_mode_label
              - setpoint
          - lvgl.widget.show:
              - fan_mode_thermostat
              - fan_selector
          - lvgl.widget.update:
              id: turbo_mode_switch
              opa: 20%
    - if:
        condition:
          lambda: 'return mode == "auto";'
        then:
          - lvgl.widget.update:
              id: auto_mode_button
              state:
                checked: true
          - lvgl.widget.update:
              id:
                - cool_mode_button
                - heat_mode_button
                - fan_mode_button
                - off_mode_button
              state:
                checked: false
          - lvgl.label.update:
              id: hvac_mode_label
              text: "Auto"
          - lvgl.widget.hide:
              - cool_mode_thermostat
              - heat_mode_thermostat
              - fan_mode_thermostat
              - off_mode_thermostat
              - off_mode_label
          - lvgl.widget.show:
              - auto_mode_thermostat
              - fan_selector
              - setpoint
          - lvgl.widget.update:
              id: turbo_mode_switch # TODO: can we do turbo in auto mode?
              opa: 20%

- id: update_fan_mode_ui
  mode: restart
  parameters:
    fan_mode: string
  then:
    - if:
        condition:
        # only update if fan mode has changed, to avoid infinite loop
          lambda: 'return fan_mode != id(fan_options_select).current_option();'
        then:
        - if:
            condition:
              lambda: 'return fan_mode == "auto";'
            then:
              - lvgl.dropdown.update:
                  id: fan_options
                  selected_index: 0
        - if:
            condition:
              lambda: 'return fan_mode == "low";'
            then:
              - lvgl.dropdown.update:
                  id: fan_options
                  selected_index: 2
        - if:
            condition:
              lambda: 'return fan_mode == "medium";'
            then:
              - lvgl.dropdown.update:
                  id: fan_options
                  selected_index: 3
        - if:
            condition:
              lambda: 'return fan_mode == "high";'
            then:
              - lvgl.dropdown.update:
                  id: fan_options
                  selected_index: 4
- id: update_hvac_status_ui
  then:
    lambda: |-
      std::string hvac_status_str = id(hvac_status).state;

      ESP_LOGD("thermostat_ui.update_hvac_status_ui", "Executing update_hvac_status_ui script, hvac_status_str is '%s'", hvac_status_str.c_str());
      
      lv_color_t status_text_color;
      lv_color_t status_bg_color;
      
      // default set the font style to normal text
      lv_obj_set_style_text_font(id(hvac_status_label), &lv_font_montserrat_30, LV_PART_MAIN);

      if (hvac_status_str == "Diffusing") {
        status_text_color = status_bg_color = my_colors::arc_fan_knob;
      } else if (hvac_status_str == "Cooling") {
        status_text_color = status_bg_color = my_colors::arc_cool_knob;
      } else if (hvac_status_str == "Heating") {
        status_text_color = status_bg_color = my_colors::arc_heat_knob;
      } else if (hvac_status_str == "Idle") {
        status_bg_color = my_colors::main_background_color;
        status_text_color = my_colors::text_dark_gray;
      } else {
        status_bg_color = my_colors::main_background_color;
        status_text_color = my_colors::text_red;
        ESP_LOGE("thermostat_ui.update_hvac_status_ui", "unexpected hvac_status_str: '%s'!", hvac_status_str.c_str());
        hvac_status_str = "\U000F002A";
        // set font to icons
        lv_obj_set_style_text_font(id(hvac_status_label), mdi_icons_30->get_lv_font(), LV_PART_MAIN);
      }
      
      lv_label_set_text(id(hvac_status_label), hvac_status_str.c_str());
      lv_obj_set_style_text_color(id(hvac_status_label), status_text_color, LV_PART_MAIN);
      lv_obj_set_style_bg_color(id(hvac_status_background), status_bg_color, LV_PART_MAIN);

      // force redraw
      lv_obj_invalidate(id(hvac_status_container));

number:
  - platform: template
    id: visible_setpoint_value
    name: "Setpoint"
    mode: box
    unit_of_measurement: "°F"
    device_class: temperature
    min_value: $thermostat_arc_min_value
    max_value: $thermostat_arc_max_value
    step: 1
    optimistic: true
    initial_value: $initial_setpoint_value
    restore_value: true
    set_action:
      - logger.log:
          format: "visible_setpoint_value changed to %.1f, running update_setpoint script."
          args: x
          level: DEBUG
          tag: "thermostat_ui.visible_setpoint_value"
      - script.execute: 
          id: update_setpoints
          visible_setpoint: x

sensor:
  # AQI
  - platform: homeassistant
    id: aqi_sensor
    entity_id: sensor.airnow_aqi_persistent
    internal: true
    on_raw_value:
      then:
        - if:
            condition:
              lambda: 'return id(aqi_sensor).has_state();'
            then:
              - lvgl.label.update:
                  id: aqi_number
                  text: !lambda 'return to_string((int)x);'
                  text_color: !lambda 'return get_aqi_text_color((float)x);'
              - lvgl.label.update:
                  id: aqi_icon
                  text_color: !lambda 'return get_aqi_text_color((float)x);'
              - lvgl.widget.update:
                  id: aqi_chip
                  bg_color: !lambda 'return get_aqi_bg_color((float)x);'
                  shadow_color: !lambda 'return get_aqi_bg_color((float)x);'
              - if:
                  condition:
                    lambda: 'return x >= 300;'
                  then:
                    - lvgl.label.update:
                        id: aqi_label
                        text_color: !lambda 'return my_colors::text_light_gray;'
                  else:
                    - lvgl.label.update:
                        id: aqi_label
                        text_color: !lambda 'return my_colors::text_dark_gray;'
            else:
              - lvgl.label.update:
                  id: aqi_number
                  text: "err"
                  text_color: !lambda 'return my_colors::text_dark_gray;'
              - lvgl.widget.update:
                  id: aqi_chip
                  bg_color: !lambda 'return my_colors::text_light_gray;'
                  shadow_color: !lambda 'return my_colors::text_light_gray;'

  
  # Inside house temp
  - platform: homeassistant
    id: average_house_temperature
    entity_id: sensor.average_house_temperature
    device_class: temperature
    unit_of_measurement: "°F"
    on_value:
      then:
        - lvgl.label.update:
            id: current_temp_number
            text: !lambda 'return to_string((int)x) + "°F";'
        - lvgl.arc.update:
            id: 
              - heat_arc_actual_temp
              - auto_heat_arc_actual_temp
              - auto_cool_arc_actual_temp
            value: !lambda 'return (int)x;'
        - lvgl.arc.update:
            id: 
              - cool_arc_actual_temp
              - auto_cool_arc_actual_temp
            value: !lambda |-
              int min_val = (int)id(thermostat_arc_min_value_global);
              int max_val = (int)id(thermostat_arc_max_value_global);
              int actual_temp = (int)x;
              int result = max_val - actual_temp + min_val;
              // FIXME: why is this log message always triggering twice?
              ESP_LOGI("thermostat_ui.average_house_temperature", "House temp changed to %f. Updating actual temp arcs: min_val=%d, actual_temp=%d, result=%d", x, min_val, actual_temp, result);
              return result;
  
  # next rain probability
  - platform: homeassistant
    id: next_rain_probability
    entity_id: sensor.next_rain_forecast
    attribute: precipitation_probability
    internal: true
    on_value: 
      then:
        lvgl.label.update:
          id: next_rain_probability_label
          text: !lambda 'return to_string((int)x) + "%";'

  # wind speed forecast
  - platform: homeassistant
    id: wind_speed_today
    entity_id: sensor.nws_now_forecast
    internal: true
    attribute: wind_speed
    on_value:
      then:
        - lvgl.label.update:
            id: wind_speed_label
            text: !lambda 'return to_string((int)x);'
        - script.execute: update_wind_color


  # wind bearing forecast
  # TODO: hook this up to something
  # - platform: homeassistant
  #   id: wind_bearing_today
  #   entity_id: sensor.nws_now_forecast
  #   internal: true
  #   attribute: wind_bearing

  # wind gust forecast
  - platform: homeassistant
    id: wind_gust_today
    entity_id: sensor.nws_now_forecast
    internal: true
    attribute: wind_gust
    on_value:
      then:
        - lvgl.label.update:
            id: wind_gust_label
            text: !lambda 'return "Gust " + to_string((int)x);'
        - script.execute: update_wind_color
  
  # todays high or low
  # TODO: guard against unavailable
  - platform: homeassistant
    id: temperature_today
    unit_of_measurement: "°F"
    device_class: temperature
    entity_id: sensor.nws_now_forecast
    internal: true
    attribute: temperature
    on_value:
      if:
        condition:
          lambda: 'return id(forecast_is_daytime).state;'
        then:
          - lvgl.label.update:
              id: days_high_number
              text: !lambda 'return to_string((int)x) + "°F";'
              text_color: !lambda 'return get_temp_text_color((float)x);'
          - lvgl.label.update:
              id: days_high_icon
              text_color: !lambda 'return get_temp_text_color((float)x);'
          - lvgl.label.update:
              id: days_high_label
              text: "High"
          - lvgl.widget.update:
              id: days_high_chip
              bg_color: !lambda 'return get_temp_bg_color((float)x);'
              shadow_color: !lambda 'return get_temp_bg_color((float)x);'
          - script.execute: 
              id: update_temp_icon
              temp: !lambda 'return x;'
              target_label: !lambda return id(days_high_icon);
              default_icon: "\U000F0E03" # thermometer up
        else:
          - lvgl.label.update:
              id: days_low_number
              text: !lambda 'return to_string((int)x) + "°F";'
              text_color: !lambda 'return get_temp_text_color((float)x);'
          - lvgl.label.update:
              id: days_low_icon
              text_color: !lambda 'return get_temp_text_color((float)x);'
          - lvgl.widget.update:
              id: days_low_chip
              bg_color: !lambda 'return get_temp_bg_color((float)x);'
              shadow_color: !lambda 'return get_temp_bg_color((float)x);'
          - script.execute: 
              id: update_temp_icon
              temp: !lambda 'return x;'
              target_label: !lambda return id(days_low_icon);
              default_icon: "\U000F0E02" # thermometer down
  
  # todays low or tomorrows high
  # TODO: guard against unavailable
  - platform: homeassistant
    id: temperature_next
    unit_of_measurement: "°F"
    device_class: temperature
    entity_id: sensor.nws_next_forecast
    internal: true
    attribute: temperature
    on_value:
      if:
        condition:
          lambda: 'return id(forecast_is_daytime).state;'
        then:
          - lvgl.label.update:
              id: days_low_number
              text: !lambda 'return to_string((int)x) + "°F";'
              text_color: !lambda 'return get_temp_text_color((float)x);'
          - lvgl.label.update:
              id: days_low_icon
              text_color: !lambda 'return get_temp_text_color((float)x);'
          - lvgl.widget.update:
              id: days_low_chip
              bg_color: !lambda 'return get_temp_bg_color((float)x);'
              shadow_color: !lambda 'return get_temp_bg_color((float)x);'
          - script.execute: 
              id: update_temp_icon
              temp: !lambda 'return x;'
              target_label: !lambda return id(days_low_icon);
              default_icon: "\U000F0E02" # thermometer down
              
        else:
          - lvgl.label.update:
              id: days_high_number
              text: !lambda 'return to_string((int)x) + "°F";'
              text_color: !lambda 'return get_temp_text_color((float)x);'
          - lvgl.label.update:
              id: days_high_icon
              text_color: !lambda 'return get_temp_text_color((float)x);'
          - lvgl.label.update:
              id: days_high_label
              text: "High"
          - lvgl.widget.update:
              id: days_high_chip
              bg_color: !lambda 'return get_temp_bg_color((float)x);'
              shadow_color: !lambda 'return get_temp_bg_color((float)x);'
          - script.execute: 
              id: update_temp_icon
              temp: !lambda 'return x;'
              target_label: !lambda return id(days_high_icon);
              default_icon: "\U000F0E03" # thermometer up
  
  # outside temp
  - platform: homeassistant
    id: outside_temp_sensor
    entity_id: sensor.average_outside_temperature
    unit_of_measurement: "°F"
    device_class: temperature
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: outside_temp_number
            text: !lambda 'return to_string((int)x) + "°F";'
            text_color: !lambda 'return get_temp_text_color((float)x);'
        - lvgl.widget.update:
            id: outside_temp_chip
            bg_color: !lambda 'return get_temp_bg_color((float)x);'
            shadow_color: !lambda 'return get_temp_bg_color((float)x);'
        - lvgl.label.update:
            id: outside_temp_icon
            text_color: !lambda 'return get_temp_text_color((float)x);'
        - script.execute: 
            id: update_temp_icon
            temp: !lambda 'return x;'
            target_label: !lambda return id(outside_temp_icon);
            default_icon: "\U000F050F" # thermometer
    
binary_sensor:
  # use to order the temp chips
  - platform: homeassistant
    id: forecast_is_daytime
    entity_id: sensor.nws_now_forecast
    internal: true
    attribute: is_daytime

text_sensor:
  # next rain day
  - platform: homeassistant
    id: next_rain_day_sensor
    entity_id: sensor.next_rain_forecast
    internal: true
    on_raw_value: 
      then:
        if:
          condition:
            lambda: 'return id(next_rain_day_sensor).has_state();'
          then:
            if:
              condition:
                lambda: 'return x == "No Rain Forecasted";'
              then:
                - lvgl.label.update:
                    id: next_rain_day
                    text: "Dry"
                    text_color: !lambda 'return my_colors::text_green;'
                - lvgl.label.update:
                    id: next_rain_probability_label
                    text_color: !lambda 'return my_colors::text_green;'
                - lvgl.widget.update:
                    id: next_rain_chip
                    bg_color: !lambda 'return my_colors::bg_green;'
                    shadow_color: !lambda 'return my_colors::bg_green;'
              else:
                - lvgl.label.update:
                    id: next_rain_day
                    text: !lambda 'return x.substr(0, 3);'
                    text_color: !lambda 'return my_colors::text_dark_blue;'
                - lvgl.label.update:
                    id: next_rain_probability_label
                    text_color: !lambda 'return my_colors::text_dark_blue;'
                - lvgl.widget.update:
                    id: next_rain_chip
                    bg_color: !lambda 'return my_colors::bg_dark_blue;'
                    shadow_color: !lambda 'return my_colors::bg_dark_blue;'
          else:
            - lvgl.label.update:
                id: next_rain_day
                text: "err"
                text_color: !lambda 'return my_colors::text_dark_gray;'
            - lvgl.widget.update:
                id: next_rain_chip
                bg_color: !lambda 'return my_colors::text_light_gray;'
                shadow_color: !lambda 'return my_colors::text_light_gray;'
  
  # weather conditions
  - platform: homeassistant
    id: conditions_today
    entity_id: sensor.nws_now_forecast
    internal: true
    attribute: condition_icon_token
    on_raw_value:
      then:
        if:
          condition:
            lambda: 'return id(conditions_today).has_state();'
          then:
            script.execute: update_condition_icon
          else:
            lvgl.label.update:
              id: days_condition_icon
              text: "\U000F002A"
              text_color: !lambda 'return my_colors::text_red;'


