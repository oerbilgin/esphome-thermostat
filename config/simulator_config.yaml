esphome:
  name: hvac-thermostat-sim
  friendly_name: Simulated HVAC Thermostat

logger:
  level: VERY_VERBOSE
  initial_level: DEBUG
  logs:
    sensor: DEBUG
    # text_sensor: DEBUG
    # select: VERBOSE
    # button: VERBOSE
    number: DEBUG
    # script: VERBOSE
    touchscreen: DEBUG
    api.service: DEBUG
    climate: VERY_VERBOSE


packages:
  main_ui: !include modules/thermostat_ui.yaml
  time_config: !include modules/time_host.yaml
  xye_config: !include modules/mideaXYE.yaml
  xye_all: !include modules/mideaXYE_all_recbytes.yaml

host:

# network and api sections so simulator can talk to hass
network:
  enable_ipv6: false

api:
  encryption:
    key: !secret encryption_key

display:
  - platform: sdl
    id: my_display
    dimensions:
      width: 800
      height: 480

touchscreen:
  - platform: sdl
    id: my_touch
    display: my_display

number: 
# these are for simulating new data from the midea unit
  - platform: template
    name: "Simulated xyeVars.fanBytes"
    id: xyeVars_fanBytes
    step: 1
    mode: box
    min_value: 0
    max_value: 255
    update_interval: $sensor_update_interval
    lambda: |-
      return xyeVars.fanBytes;
    set_action:
      - lambda: |-
          xyeVars.fanBytes = x;

  - platform: template
    name: "Simulated xyeVars.fanBytesSend"
    id: xyeVars_fanBytesSend
    step: 1
    mode: box
    min_value: 0
    max_value: 255
    update_interval: $sensor_update_interval
    lambda: |-
      return xyeVars.fanBytesSend;
    set_action:
      - lambda: |-
          xyeVars.fanBytesSend = x;
          xyeVars.fanBytes = x;
          xyeVars.recData[REC_FAN] = x;
    on_value:
      - lambda: |-
          xyeVars.fanBytesSend = x;
          xyeVars.fanBytes = x;
          xyeVars.recData[REC_FAN] = x;

  - platform: template
    name: "Simulated xyeVars.opBytes"
    id: xyeVars_opBytes
    step: 1
    mode: box
    min_value: 0
    max_value: 255
    update_interval: $sensor_update_interval
    lambda: |-
      return xyeVars.opBytes;
    set_action:
      - lambda: |-
          xyeVars.opBytes = x;
          xyeVars.recData[REC_MODE] = x;

  - platform: template
    name: "Simulated xyeVars.opBytesSend"
    id: xyeVars_opBytesSend
    step: 1
    mode: box
    min_value: 0
    max_value: 255
    update_interval: $sensor_update_interval
    lambda: |-
      return xyeVars.opBytesSend;
    set_action:
      - lambda: |-
          xyeVars.opBytesSend = x;
          xyeVars.opBytes = x;
          xyeVars.recData[REC_MODE] = x;
    on_value:
      - lambda: |-
          xyeVars.opBytesSend = x;
          xyeVars.opBytes = x;
          xyeVars.recData[REC_MODE] = x;

  - platform: template
    name: "Simulated xyeVars.setTemp"
    id: xyeVars_setTemp
    step: 1
    mode: box
    min_value: 0
    max_value: 100
    # keep it synced with setTemp if that changes
    update_interval: $sensor_update_interval
    lambda: |-
      return xyeVars.setTemp;
    set_action:
      # keep it synced with setTemp if our simulated value changes
      - lambda: |-
          xyeVars.setTemp = x;
    on_value:
      - lambda: 'xyeVars.recData[REC_TEMP] = x;'
  
  - platform: template
    name: "Simulated xyeVars.setTempSend"
    id: xyeVars_setTempSend
    step: 1
    mode: box
    min_value: 0
    max_value: 100
    # keep it synced with setTemp if that changes
    update_interval: $sensor_update_interval
    lambda: |-
      return xyeVars.setTempSend;
    set_action:
      # keep it synced with setTemp if our simulated value changes
      - lambda: |-
          xyeVars.setTemp = x;
          xyeVars.setTempSend = x;
          xyeVars.recData[REC_TEMP] = x;
    on_value:
      - lambda: |-
          xyeVars.setTemp = x;
          xyeVars.setTempSend = x;
          xyeVars.recData[REC_TEMP] = x;

  - platform: template
    name: "Simulated T1 temp"
    id: t1_sim
    step: 1
    mode: box
    min_value: 0
    max_value: 100
    optimistic: true
    set_action:
      - logger.log:
          format: "Simulated t1 temp set to %f, updating xyeVars.recData"
          args: x
          level: DEBUG
          tag: simulator_config.t1_sim
      - lambda: |-
          xyeVars.recData[T1_INDEX] = x;
          ESP_LOGD("simulator_config.t1_sim", "xyeVars.recData[%i] is now %u", T1_INDEX, xyeVars.recData[T1_INDEX]);
  
  - platform: template
    name: "Simulated fanmode"
    id: fan_sim
    step: 1
    mode: box
    min_value: 0
    max_value: 255
    optimistic: true
    set_action:
      - logger.log:
          format: "Simulated fanmode set to %f, updating xyeVars.recData"
          args: x
          level: DEBUG
          tag: simulator_config.fan_sim
      - lambda: |-
          xyeVars.recData[REC_FAN] = x;
          ESP_LOGD("simulator_config.fan_sim", "xyeVars.recData[%i] is now 0x%02x", REC_FAN, xyeVars.recData[REC_FAN]);
          xyeVars.fanBytes = x;
          ESP_LOGD("simulator_config.fan_sim", "xyeVars.fanBytes is now 0x%02x", xyeVars.recData[REC_FAN]);
  - platform: template
    name: "Simulated opmode"
    id: opmode_sim
    step: 1
    mode: box
    min_value: 0
    max_value: 255
    optimistic: true
    set_action:
      - logger.log:
          format: "Simulated opmode set to %f, updating xyeVars.recData"
          args: x
          level: DEBUG
          tag: simulator_config.opmode_sim
      - lambda: |-
          xyeVars.recData[REC_MODE] = x;
          ESP_LOGD("simulator_config.opmode_sim", "xyeVars.recData[%i] is now 0x%02x", REC_MODE, xyeVars.recData[REC_MODE]);
          xyeVars.opBytes = x;
          ESP_LOGD("simulator_config.opmode_sim", "xyeVars.fanBytes is now 0x%02x", xyeVars.recData[REC_MODE]);